[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-rf-studio"
version = "0.1.0.dev0"
description = "Simulate the RF parts of a KiCad board with openEMS"
readme = "README.md"
license = "GPL-3.0-or-later AND LGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "numpy>=2", "scipy", "h5py", "matplotlib", "scikit-rf>=2.2", "PySide6-Essentials>=6.10.1,<7", "kicad-python>=0.8,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kicad-rf-studio = "kicad_rf_studio.cli:main"

[project.gui-scripts]
kicad-rf-studio-gui = "kicad_rf_studio.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_rf_studio = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = ["openems: needs openEMS importable in this Python (CI tier b)"]
